[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogtrans"
version = "1.2.3"
description = "An async and updated version of the googletrans package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Z", email = "bleg3ndary@gmail.com" }]
keywords = ["google", "translate", "translator", "async"]
requires-python = ">=3.10"
dependencies = ["httpx[http2]>=0.23.0,<1.0.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Leg3ndary/aiogtrans"

[project.scripts]
aiogtrans = "aiogtrans.__main__:main"

[tool.setuptools.packages.find]
exclude = ["docs*", "tests*"]

[tool.setuptools.package-data]
aiogtrans = ["py.typed"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
